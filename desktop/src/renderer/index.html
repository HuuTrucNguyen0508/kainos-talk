<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:" />
    <meta name="color-scheme" content="light dark" />
    <title>Kainos Talk</title>
    <link rel="stylesheet" href="main.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <nav class="rail" aria-label="Services">
      <button class="mark-button" id="bar-options" type="button" aria-haspopup="menu" aria-label="Kainos Talk bar options" title="Bar options">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="8" />
          <circle class="mark-ring" cx="16" cy="16" r="7.7" />
          <circle class="mark-dot" cx="16" cy="16" r="2.4" />
        </svg>
      </button>
      <ul class="sockets" id="sockets"></ul>
    </nav>
    <main class="stage" id="stage" aria-live="polite"></main>
  </body>
</html>
