/* TOKENS-LIGHT */
.phone, .phone[data-theme='light'] {
  --surface: #f6f8f7;
  --board: #dde4e1;
  --edge: #c5d0cc;
  --raised: #e8edeb;
  --ink: #1c2a2d;
  --soft: #4b5c5f;
  --teal: #0e6b66;
  --on-teal: #f6f8f7;
  --out: #0e6b66;
  --on-out: #f6f8f7;
  --lamp: #e6a11a;
  --lamp-ink: #1c2a2d;
  --lamp-edge: #8a5a00;
  --alert: #b3261e;
  --outline: #6c807d;
  --wa: #2e6b4f;
  --dc: #4a5591;
  --pm: #73478a;
  --on-line: #ffffff;
  color-scheme: light;
}
/* TOKENS-DARK */
.phone[data-theme='dark'] {
  --surface: #0e1619;
  --board: #162024;
  --edge: #24343a;
  --raised: #1b282d;
  --ink: #d6e2df;
  --soft: #93a6a6;
  --teal: #4cbcb1;
  --on-teal: #0e1619;
  --out: #1a4f4b;
  --on-out: #e3eeeb;
  --lamp: #f0b42e;
  --lamp-ink: #162024;
  --lamp-edge: #f0b42e;
  --alert: #f2a59f;
  --outline: #6f8585;
  --wa: #8fd0ae;
  --dc: #aab4ec;
  --pm: #d3a8e6;
  --on-line: #0e1619;
  color-scheme: dark;
}
/* TOKENS-END */

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #cbd5d1;
  color: #1c2a2d;
  font: 400 15px/1.45 'Atkinson Hyperlegible', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
.band.dark { flex: 1; }

/* ---------- Presentation board ---------- */
.sheet-head { padding: 56px 64px 8px; max-width: 1500px; }
.sheet-head h1 { margin: 0; font-size: 52px; line-height: 1.05; letter-spacing: -0.015em; }
.sheet-head p { margin: 14px 0 0; font-size: 20px; line-height: 1.4; max-width: 62ch; color: #33474a; }
.band { padding: 36px 64px 56px; }
.band.dark { background: #060b0d; color: #d6e2df; }
.band > h2 { margin: 0 0 20px; font-size: 18px; font-weight: 700; }
.set { display: flex; gap: 40px; }
.frame { flex: none; }
.frame figcaption { margin-top: 14px; font-size: 15px; color: #33474a; }
.band.dark .frame figcaption { color: #93a6a6; }
.frame .phone { border-radius: 30px; box-shadow: 0 0 0 1px rgba(28,42,45,.22), 0 18px 40px -18px rgba(28,42,45,.45); }
.band.dark .frame .phone { box-shadow: 0 0 0 1px #2c3d43; }

body.single { background: transparent; }
body.single .sheet-head, body.single .band > h2, body.single figcaption { display: none; }
body.single .band { padding: 0; background: none; }
body.single .frame .phone { border-radius: 0; box-shadow: none; }

/* ---------- Phone ---------- */
.phone {
  position: relative;
  width: 412px;
  height: 915px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  color: var(--ink);
  font: 400 15px/1.45 'Atkinson Hyperlegible', system-ui, sans-serif;
}
.phone p, .phone h1, .phone h2, .phone h3 { margin: 0; }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.s18 { width: 18px; height: 18px; }
.ico.s16 { width: 16px; height: 16px; }

.statusbar {
  flex: none; height: 36px; padding: 6px 22px 0;
  display: flex; align-items: center; justify-content: space-between;
  font: 700 14px/1 'Atkinson Hyperlegible', sans-serif;
}
.statusbar svg { height: 13px; width: auto; fill: var(--ink); display: block; }
.gesture { position: absolute; left: 50%; bottom: 9px; width: 108px; height: 4px; margin-left: -54px; border-radius: 2px; background: var(--ink); z-index: 5; }

.appbar { flex: none; height: 64px; padding: 0 4px 0 16px; display: flex; align-items: center; gap: 12px; }
.appbar.nav { padding-left: 4px; gap: 4px; }
.appbar h1 { flex: 1; min-width: 0; font-size: 22px; line-height: 28px; font-weight: 700; }
.appbar .titles { flex: 1; min-width: 0; padding-left: 10px; }
.appbar .titles h1 { font-size: 18px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .titles p { font-size: 13px; line-height: 18px; color: var(--soft); }
.iconbtn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; color: var(--ink); flex: none; }

/* App mark: the desktop socket, ring and contact */
.mark { width: 32px; height: 32px; flex: none; display: block; }
.mark rect { fill: var(--teal); }
.mark .ring { fill: none; stroke: var(--on-teal); stroke-width: 2.6; }
.mark .dot { fill: var(--on-teal); }

/* Avatars: one tile shape for everything, as on the desktop rail */
.av {
  --behind: var(--surface);
  position: relative; flex: none;
  width: 48px; height: 48px; border-radius: 16px;
  display: grid; place-items: center;
  background: var(--board); box-shadow: inset 0 0 0 1px var(--edge);
  color: var(--teal); font: 700 16px/1 'Atkinson Hyperlegible', sans-serif;
}
.av.sm { width: 40px; height: 40px; border-radius: 14px; font-size: 14px; }
.av.photo-plot { box-shadow: none; background:
  radial-gradient(circle at 28% 74%, #a9cc74 0 20%, transparent 21%),
  radial-gradient(circle at 70% 42%, #4f8a45 0 29%, transparent 30%),
  radial-gradient(circle at 44% 22%, #f0d77a 0 11%, transparent 12%),
  linear-gradient(160deg, #cfe3a8, #7dab5f); }
.av.photo-ines { box-shadow: none; background:
  radial-gradient(circle at 50% 40%, #5b3a2c 0 17%, transparent 18%),
  radial-gradient(ellipse at 50% 104%, #2b5a60 0 40%, transparent 41%),
  linear-gradient(#ecc99b, #d8a475); }

/* Line jacks: which app a conversation came through. Shape and letter carry it; hue only helps. */
.jack {
  position: absolute; right: -6px; bottom: -6px;
  height: 22px; width: 22px;
  border: 2px solid var(--behind);
  color: var(--on-line);
  font: 700 11px/18px 'Atkinson Hyperlegible', sans-serif; text-align: center;
}
.jack.inline { position: static; border: 0; height: 18px; width: 18px; line-height: 18px; flex: none; display: inline-block; }
.jack.wa { background: var(--wa); border-radius: 50%; }
.jack.dc { background: var(--dc); border-radius: 7px; }
.jack.pm { background: var(--pm); border-radius: 4px; width: 26px; right: -8px; }
.jack.inline.wa { border-radius: 50%; }
.jack.inline.dc { border-radius: 5px; }
.jack.inline.pm { border-radius: 3px; width: 22px; }
.lines .slot { width: 24px; display: grid; justify-items: center; flex: none; }

/* Lamps: amber when a line wants attention */
.lamp {
  display: inline-block; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  background: var(--lamp); color: var(--lamp-ink);
  box-shadow: inset 0 0 0 1px var(--lamp-edge);
  font: 700 12px/22px 'Atkinson Hyperlegible', sans-serif; text-align: center;
}
.lamp.off { background: transparent; color: var(--soft); box-shadow: inset 0 0 0 1.5px var(--outline); }

/* ---------- Inbox ---------- */
.list { flex: 1; min-height: 0; overflow: hidden; }
.row {
  position: relative;
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; column-gap: 16px;
  padding: 12px 16px 12px 16px; min-height: 72px; align-items: start;
}
.row + .row::before { content: ''; position: absolute; top: 0; left: 80px; right: 0; height: 1px; background: var(--edge); }
.row .who { font-size: 16px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .chan { color: var(--soft); font-weight: 400; margin-left: 4px; }
.row .subj, .row .msg { font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .msg { color: var(--soft); }
.row .msg .ico { vertical-align: -3px; margin-right: 3px; }
.row .meta { display: grid; justify-items: end; row-gap: 3px; color: var(--soft); font-size: 12px; line-height: 24px; white-space: nowrap; }
.row .meta .when { display: flex; align-items: center; gap: 4px; }
.row.unread .who, .row.unread .subj { font-weight: 700; }
.row.unread .msg { color: var(--ink); }
.row.unread .meta .when { color: var(--ink); font-weight: 700; }

/* ---------- The board: sage panel at the bottom of every screen ---------- */
.board {
  flex: none; position: relative;
  background: var(--board); box-shadow: inset 0 1px var(--edge);
  padding: 0 16px 26px;
}
.sockets { display: flex; height: 84px; }
.socket { --behind: var(--board); flex: 1; position: relative; display: grid; justify-items: center; align-content: start; row-gap: 4px; padding-top: 10px; }
.socket-tab { position: absolute; inset: 0 4px 0 4px; border-radius: 0 0 20px 20px; background: var(--surface); opacity: 0; }
.socket-tab::before, .socket-tab::after { content: ''; position: absolute; top: 0; width: 16px; height: 16px; }
.socket-tab::before { left: -16px; background: radial-gradient(circle at 0 100%, transparent 15.5px, var(--surface) 16px); }
.socket-tab::after { right: -16px; background: radial-gradient(circle at 100% 100%, transparent 15.5px, var(--surface) 16px); }
.socket[data-active] { --behind: var(--surface); }
.socket[data-active] .socket-tab { opacity: 1; }
.socket[data-active]::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 28px; height: 3px; margin-left: -14px; border-radius: 3px 3px 0 0; background: var(--teal); }
.tile {
  position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center;
  background: var(--line, var(--teal)); color: var(--on-line);
  font: 700 19px/1 'Atkinson Hyperlegible', sans-serif;
}
.tile.all { background: var(--teal); }
.tile.all svg { width: 26px; height: 26px; }
.tile.all .ring { fill: none; stroke: var(--on-teal); stroke-width: 2.4; }
.tile.all .dot { fill: var(--on-teal); }
.tile .lamp { position: absolute; top: -7px; right: -10px; height: 22px; line-height: 18px; padding: 0 4px; border: 2px solid var(--behind); box-shadow: inset 0 0 0 1px var(--lamp-edge); }
.socket .name { position: relative; z-index: 1; font-size: 12px; line-height: 16px; color: var(--soft); }
.socket[data-active] .name { color: var(--teal); font-weight: 700; }

/* ---------- Thread ---------- */
.thread { flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 12px; display: flex; flex-direction: column; justify-content: flex-end; }
.origin { background: var(--board); border-radius: 20px; padding: 14px 16px 6px; display: grid; grid-template-columns: 28px 1fr; column-gap: 12px; }
.origin .socket-ico { width: 28px; height: 28px; margin-top: 1px; }
.origin .socket-ico circle { fill: none; stroke: var(--teal); stroke-width: 2.2; }
.origin .socket-ico .dot { fill: var(--teal); stroke: none; }
.origin h3 { font-size: 15px; line-height: 21px; font-weight: 700; }
.origin p { font-size: 14px; line-height: 20px; color: var(--soft); margin-top: 2px; }
.textbtn { display: inline-flex; align-items: center; gap: 6px; height: 48px; color: var(--teal); font: 700 14px/1 'Atkinson Hyperlegible', sans-serif; }
.day { text-align: center; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--soft); margin: 14px 0 8px; }
.sender { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--teal); }
.bubble { max-width: 300px; padding: 8px 12px; border-radius: 18px; font-size: 15px; line-height: 21px; }
.bubble .t { float: right; margin: 5px 0 -3px 12px; font-size: 12px; line-height: 16px; }
.bubble.in { align-self: flex-start; background: var(--raised); border-top-left-radius: 6px; margin-top: 8px; }
.bubble.in.cont { margin-top: 3px; }
.bubble.in .t { color: var(--soft); }
.bubble.out { align-self: flex-end; background: var(--out); color: var(--on-out); border-bottom-right-radius: 6px; margin-top: 8px; }
.bubble.out .t { display: inline-flex; align-items: center; gap: 3px; }
.bubble.media { display: grid; grid-template-columns: 40px 1fr auto; column-gap: 12px; align-items: center; min-height: 56px; padding-right: 10px; }
.bubble.media .ph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--soft); border: 1.5px dashed var(--outline); }
.bubble.media b { display: block; line-height: 20px; }
.bubble.media .where { display: block; font-size: 13px; line-height: 18px; color: var(--soft); }
.bubble.media > .ico { color: var(--teal); }
.bubble.failed { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--alert); }
.fail { align-self: flex-end; max-width: 300px; margin-top: 6px; display: grid; grid-template-columns: 18px 1fr; column-gap: 8px; color: var(--alert); font-size: 13px; line-height: 18px; }
.fail .ico { margin-top: 0; }
.fail .textbtn { grid-column: 2; height: 44px; margin-bottom: -8px; }

.board.compose { display: flex; align-items: center; gap: 10px; padding: 10px 12px 34px 12px; }
.field {
  flex: 1; min-width: 0; height: 52px; border-radius: 18px; padding: 0 14px;
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--outline);
  font-size: 16px; line-height: 22px;
}
.field .caret { width: 2px; height: 22px; background: var(--teal); margin-left: -8px; }
.sendbtn { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--teal); color: var(--on-teal); }

/* ---------- Mail ---------- */
.mail { flex: 1; min-height: 0; padding: 8px 20px 0; }
.mail .from { display: flex; align-items: center; gap: 16px; }
.mail .from b { display: block; font-size: 16px; line-height: 22px; }
.mail .from span.when { display: block; font-size: 13px; line-height: 18px; color: var(--soft); }
.mail h2 { margin-top: 28px; font-size: 28px; line-height: 34px; letter-spacing: -0.01em; font-weight: 700; }
.slip { margin-top: 20px; padding: 16px 18px 18px; background: var(--raised); border-radius: 20px 20px 0 0; border-bottom: 2px dashed var(--outline); font-size: 16px; line-height: 24px; }
.mail .cut { margin-top: 16px; padding-left: 18px; font-size: 14px; line-height: 20px; color: var(--soft); max-width: 36ch; }
.board.action { padding: 14px 16px 34px; }
.board.action .hint { font-size: 14px; line-height: 20px; color: var(--soft); margin-bottom: 10px; }
.bigbtn { height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--teal); color: var(--on-teal); font: 700 16px/1 'Atkinson Hyperlegible', sans-serif; }

/* ---------- First run ---------- */
.setup { flex: 1; min-height: 0; padding: 18px 24px 0; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; }
.setup h1 { margin-top: 26px; font-size: 30px; line-height: 36px; letter-spacing: -0.012em; font-weight: 700; }
.setup .lede { margin-top: 12px; font-size: 16px; line-height: 24px; }
.facts { margin: 20px 0 0; padding: 0; }
.facts div { display: grid; grid-template-columns: 72px 1fr; column-gap: 12px; padding: 11px 0; border-top: 1px solid var(--edge); }
.facts dt { font-weight: 700; color: var(--teal); font-size: 15px; line-height: 22px; }
.facts dd { margin: 0; font-size: 15px; line-height: 22px; }
.setup h2 { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--edge); font-size: 18px; line-height: 24px; font-weight: 700; }
.steps { list-style: none; margin: 12px 0 0; padding: 0; }
.steps li { position: relative; display: grid; grid-template-columns: 22px 1fr; column-gap: 14px; padding-bottom: 14px; }
.steps li:not(:last-child)::before { content: ''; position: absolute; left: 10px; top: 26px; bottom: 2px; width: 2px; border-radius: 1px; background: var(--edge); }
.steps b { display: block; font-size: 16px; line-height: 22px; }
.steps span.how { display: block; font-size: 14px; line-height: 20px; color: var(--soft); margin-top: 2px; }
.steps .lamp { padding: 0; }

/* ---------- Empty ---------- */
.stage { flex: 1; min-height: 0; padding: 72px 32px 0; }
.notice .mark { width: 56px; height: 56px; margin-bottom: 20px; }
.notice h2 { font-size: 22px; line-height: 28px; letter-spacing: -0.005em; font-weight: 700; }
.notice p { margin-top: 8px; color: var(--soft); max-width: 36ch; font-size: 15px; line-height: 22px; }
.signal { position: relative; width: 180px; height: 2px; margin-top: 22px; border-radius: 1px; background: var(--edge); }
.signal::after { content: ''; position: absolute; inset: 0 auto 0 56px; width: 48px; border-radius: 1px; background: var(--teal); }
.lines { list-style: none; margin: 34px 0 0; padding: 0; }
.lines li { display: flex; align-items: center; gap: 12px; height: 48px; border-top: 1px solid var(--edge); font-size: 15px; }
.lines li:last-child { border-bottom: 1px solid var(--edge); }
.lines .state { margin-left: auto; color: var(--soft); font-size: 14px; }
</style>
</head>

  <h1>Pocket Switchboard</h1>
  <p>The desktop rail turns into a sage board under your thumb. Plug into a line to filter the inbox, amber lamps mean unread, and every way out to the real apps sits on that board.</p>

<figure class="frame" data-screen="thread" style="margin:0">
<div class="phone">
  <div class="statusbar"><span>08:12</span><svg viewBox="0 0 62 13"><use href="#i-status"/></svg></div>
  <header class="appbar nav">

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var only = q.get('screen'), onlyTheme = q.get('theme');
  var tpl = document.getElementById('screens');
  ['light', 'dark'].forEach(function (theme) {
    var set = document.getElementById('set-' + theme);
    var frag = tpl.content.cloneNode(true);
    Array.prototype.forEach.call(frag.querySelectorAll('.frame'), function (f) {
      if (only && (f.dataset.screen !== only || (onlyTheme || 'light') !== theme)) return;
      f.querySelector('.phone').dataset.theme = theme;
      set.appendChild(f);
    });
    if (only && !set.children.length) set.parentNode.remove();
  });
  if (only) document.body.classList.add('single');
})();
</script>
