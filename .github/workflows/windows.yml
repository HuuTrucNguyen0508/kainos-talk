# Builds the Windows app on Windows, runs the desktop unit tests there, and checks the packaged
# app starts. The installer and portable .exe are kept as the run's artifact for a release.
name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop typecheck
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop package:win
      - name: Launch check
        working-directory: desktop
        shell: pwsh
        run: ./scripts/windows-launch-check.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kainos-talk-windows
          path: |
            desktop/release/*.exe
          if-no-files-found: error
